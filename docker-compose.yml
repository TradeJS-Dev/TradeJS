# docker-compose.yml

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      timescale:
        condition: service_healthy
      ml-infer:
        condition: service_started
    image: aleksnick/inv-app:latest
    expose:
      - "3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./screenshots:/app/public/screenshots
      - ./.env:/app/.env:ro
    networks:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  timescale:
    container_name: inv-timescale
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/create.sql:/docker-entrypoint-initdb.d/01-create.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - web

  redis:
    image: redis/redis-stack:latest
    container_name: inv-redis
    restart: unless-stopped
    expose:
      - "8001"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - web

  ml-infer:
    build:
      context: .
      dockerfile: Dockerfile.infer
    container_name: ml-infer
    image: aleksnick/inv-ml-infer:latest
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/data/ml/models
      DEFAULT_STRATEGY: TrendLine
      ML_GRPC_HOST: 0.0.0.0
      ML_GRPC_PORT: 50051
    volumes:
      - ./ml:/app/ml
      - ./data:/app/data
      - ./proto:/app/proto
    expose:
      - "50051"
    networks:
      - web

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf.ssl:/etc/nginx/nginx.conf.ssl:ro
      - ./nginx/nginx.conf.nossl:/etc/nginx/nginx.conf.nossl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    entrypoint: >
      sh -c "[ -f /etc/letsencrypt/live/aleksnick01inv.fvds.ru/fullchain.pem ]
      && cp /etc/nginx/nginx.conf.ssl /etc/nginx/nginx.conf 
      || cp /etc/nginx/nginx.conf.nossl /etc/nginx/nginx.conf;
      nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
      - redis
    networks:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot
      --email aleksnick01@gmail.com --agree-tos --no-eff-email
      -d aleksnick01inv.fvds.ru -d redisinsight.aleksnick01inv.fvds.ru || true"
    networks:
      - web

  certbot-cron:
    image: certbot/certbot
    container_name: certbot-cron
    restart: on-failure
    depends_on:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: sh -c "while true; do certbot renew --webroot -w /var/www/certbot && sleep 12h; done"
    networks:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    driver: bridge

volumes:
  pgdata:
  redisdata:
