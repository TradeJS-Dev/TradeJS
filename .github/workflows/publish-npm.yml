name: Publish npm packages

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm-stable
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.act || github.repository == 'tradejs-dev/tradejs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout stable with tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.sha || 'stable' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Resolve synchronized release version
        id: release
        run: |
          yarn bump:packages auto
          version="$(node -p "require('./packages/types/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved npm release v$version"

      - name: Verify lockfile after version update
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn unit

      - name: Preflight package archives
        run: yarn npm:publish:all:dry

      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn npm whoami

      - name: Persist synchronized package versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/package.json packages/*/package.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
          fi

          git push origin HEAD:stable

      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_PROVENANCE: 'true'
        run: yarn npm:publish:all

      - name: Tag successful release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"

          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag ${tag} already points to another commit" >&2
              exit 1
            fi
          else
            git tag -a "$tag" -m "TradeJS ${tag}"
            git push origin "refs/tags/${tag}"
          fi
