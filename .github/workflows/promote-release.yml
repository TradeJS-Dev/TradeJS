name: Promote verified beta weekly
run-name: Weekly stable promotion ${{ inputs.beta_version || 'current beta' }}

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      beta_version:
        description: Exact beta version; empty selects the current beta tag
        required: false
        type: string
      confirm_promotion:
        description: Required only for a manual promotion
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write

concurrency:
  group: npm-production-release
  cancel-in-progress: false

jobs:
  promote:
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROMOTE: 'true'
      TAG_ONLY: 'false'
      INPUT_BETA_VERSION: ${{ inputs.beta_version }}
      CONFIRM_PROMOTION: ${{ inputs.confirm_promotion }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: stable
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Resolve beta and validate its complete CI evidence
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$CONFIRM_PROMOTION" != true ]; then
            echo 'confirm_promotion is required for a manual promotion' >&2
            exit 1
          fi
          beta_version="${INPUT_BETA_VERSION:-$(npm view '@tradejs/types@beta' version 2>/dev/null || true)}"
          if [ -z "$beta_version" ]; then
            echo 'PROMOTE=false' >> "$GITHUB_ENV"
            exit 0
          fi
          stable_target="${beta_version%%-beta.*}"
          current_version="$(node -p "require('./packages/types/package.json').version")"
          latest_version="$(npm view '@tradejs/types@latest' version)"
          if [ "$latest_version" = "$stable_target" ] && [ "$current_version" = "$stable_target" ]; then
            echo 'PROMOTE=false' >> "$GITHUB_ENV"
            if [ "$(git tag --list "v${stable_target}")" != "v${stable_target}" ]; then
              echo 'TAG_ONLY=true' >> "$GITHUB_ENV"
              echo "STABLE_VERSION=$stable_target" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          LATEST_VERSION="$latest_version" STABLE_TARGET="$stable_target" node -e '
            const parse = (value) => value.split(".").map(Number);
            const latest = parse(process.env.LATEST_VERSION);
            const target = parse(process.env.STABLE_TARGET);
            if (latest.some((value) => !Number.isInteger(value)) || target.some((value) => !Number.isInteger(value))) process.exit(2);
            for (let index = 0; index < 3; index += 1) {
              if (latest[index] > target[index]) process.exit(0);
              if (latest[index] < target[index]) process.exit(1);
            }
            process.exit(1);
          ' && { echo 'PROMOTE=false' >> "$GITHUB_ENV"; exit 0; }
          source_sha="$(npm view "@tradejs/types@${beta_version}" gitHead)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Beta has no full gitHead' >&2; exit 1; }
          beta_run_number="${beta_version##*.}"
          [[ "$beta_run_number" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid beta run number' >&2; exit 1; }
          matching_run="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-images.yml/runs" \
            -f branch=stable -f status=success \
            --jq ".workflow_runs[] | select(.run_number == ${beta_run_number} and .head_sha == \"${source_sha}\") | .id" | head -n 1)"
          [ -n "$matching_run" ] || { echo 'No successful beta and production-like image run found' >&2; exit 1; }
          git fetch origin stable
          release_head_sha="$(git rev-parse origin/stable)"
          if [ "$release_head_sha" != "$source_sha" ]; then
            git diff --quiet "$source_sha" "$release_head_sha" -- \
              apps/app packages examples/sandbox proto bin package.json yarn.lock \
              .yarn .yarnrc.yml turbo.json 'tsconfig*.json' tradejs.config.ts || {
                echo 'stable release inputs advanced beyond the verified beta' >&2
                exit 1
              }
          fi
          echo "BETA_VERSION=$beta_version" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "RELEASE_HEAD_SHA=$release_head_sha" >> "$GITHUB_ENV"
          git checkout --detach "$release_head_sha"
      - name: Restore a missing stable tag after a partial promotion
        if: env.TAG_ONLY == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v${STABLE_VERSION}" -m "TradeJS v${STABLE_VERSION}"
          git push origin "refs/tags/v${STABLE_VERSION}"
      - name: Enable Corepack
        if: env.PROMOTE != 'false'
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Verify beta package provenance
        if: env.PROMOTE != 'false'
        run: |
          for package_name in \
            @tradejs/types @tradejs/infra @tradejs/core @tradejs/node \
            @tradejs/indicators @tradejs/connectors @tradejs/cli @tradejs/app \
            create-tradejs
          do
            [ "$(npm view "${package_name}@${BETA_VERSION}" version)" = "$BETA_VERSION" ] || exit 1
            [ "$(npm view "${package_name}@${BETA_VERSION}" gitHead)" = "$SOURCE_SHA" ] || exit 1
          done
      - if: env.PROMOTE != 'false'
        run: yarn install --immutable
      - name: Resolve stable version
        if: env.PROMOTE != 'false'
        id: version
        run: |
          stable_version="$(node -e 'const {resolveStableVersion}=require("./bin/releaseChannel.cjs"); console.log(resolveStableVersion(process.argv[1]))' "$BETA_VERSION")"
          baseline="$(node -p "require('./packages/types/package.json').version")"
          expected_beta="$(node -e 'const {resolveBetaVersion}=require("./bin/releaseChannel.cjs"); console.log(resolveBetaVersion(process.argv[1], process.argv[2].split(".").at(-1)))' "$baseline" "$BETA_VERSION")"
          [ "$expected_beta" = "$BETA_VERSION" ] || { echo 'Beta is not the next patch from this source' >&2; exit 1; }
          yarn bump:packages "$stable_version"
          echo "stable_version=$stable_version" >> "$GITHUB_OUTPUT"
      - if: env.PROMOTE != 'false'
        run: yarn install --immutable
      - if: env.PROMOTE != 'false'
        run: yarn checks
      - if: env.PROMOTE != 'false'
        run: yarn npm:publish:all:dry
      - name: Ensure the verified source is still the stable branch head
        if: env.PROMOTE != 'false'
        run: |
          git fetch origin stable
          [ "$(git rev-parse origin/stable)" = "$RELEASE_HEAD_SHA" ] || { echo 'stable advanced after beta validation' >&2; exit 1; }
      - name: Publish stable package candidates
        if: env.PROMOTE != 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_PROVENANCE: 'true'
        run: |
          bash ./bin/publish-packages.sh --skip-checks --tag stable-candidate
          for package_name in \
            @tradejs/types @tradejs/infra @tradejs/core @tradejs/node \
            @tradejs/indicators @tradejs/connectors @tradejs/cli @tradejs/app \
            create-tradejs
          do
            [ "$(npm view "${package_name}@${{ steps.version.outputs.stable_version }}" gitHead)" = "$RELEASE_HEAD_SHA" ] || exit 1
          done
      - if: env.PROMOTE != 'false'
        run: yarn playwright install --with-deps chromium
      - name: Quickstart stable browser e2e
        if: env.PROMOTE != 'false'
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          QUICKSTART_CREATE_SPEC: create-tradejs@${{ steps.version.outputs.stable_version }}
        run: yarn quickstart:e2e
      - if: env.PROMOTE != 'false'
        run: yarn sandbox:install:update
      - if: env.PROMOTE != 'false'
        run: cp examples/sandbox/.env.example examples/sandbox/.env
      - id: sandbox_infra
        if: env.PROMOTE != 'false'
        run: yarn sandbox:infra-up
      - if: env.PROMOTE != 'false'
        run: yarn sandbox:e2e
      - if: env.PROMOTE != 'false' && always() && steps.sandbox_infra.outcome != 'skipped'
        run: yarn sandbox:infra-down
      - name: Promote all verified stable candidates to latest
        if: env.PROMOTE != 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          STABLE_VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          for package_name in \
            @tradejs/types @tradejs/infra @tradejs/core @tradejs/node \
            @tradejs/indicators @tradejs/connectors @tradejs/cli @tradejs/app \
            create-tradejs
          do
            npm dist-tag add "${package_name}@${STABLE_VERSION}" latest
          done
      - name: Persist and tag the verified stable release
        if: env.PROMOTE != 'false'
        env:
          STABLE_VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          git fetch origin stable
          [ "$(git rev-parse origin/stable)" = "$RELEASE_HEAD_SHA" ] || { echo 'stable advanced during promotion' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/app/package.json packages/*/package.json examples/sandbox/package.json examples/sandbox/yarn.lock
          git commit -m "chore(release): v${STABLE_VERSION} [skip ci]"
          git push origin HEAD:stable
          git tag -a "v${STABLE_VERSION}" -m "TradeJS v${STABLE_VERSION}"
          git push origin "refs/tags/v${STABLE_VERSION}"
      - name: Verify dist-tags
        if: env.PROMOTE != 'false'
        env:
          STABLE_VERSION: ${{ steps.version.outputs.stable_version }}
        run: |
          for package_name in \
            @tradejs/types @tradejs/infra @tradejs/core @tradejs/node \
            @tradejs/indicators @tradejs/connectors @tradejs/cli @tradejs/app \
            create-tradejs
          do
            verified=false
            for attempt in $(seq 1 12); do
              if [ "$(npm view "${package_name}@latest" version 2>/dev/null || true)" = "$STABLE_VERSION" ]; then
                verified=true
                break
              fi
              [ "$attempt" -lt 12 ] && sleep 10
            done
            [ "$verified" = true ] || exit 1
          done
