name: Validate beta and publish images

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: validate-beta-stable
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agent_changed: ${{ steps.resolve.outputs.agent_changed }}
      ml_infer_changed: ${{ steps.resolve.outputs.ml_infer_changed }}
      npm_release_changed: ${{ steps.resolve.outputs.npm_release_changed }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            npm_release:
              - 'examples/sandbox/**'
              - 'apps/app/**'
              - 'packages/**'
              - 'proto/**'
              - 'bin/**'
              - 'package.json'
              - 'yarn.lock'
              - '.yarn/**'
              - '.yarnrc.yml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'tradejs.config.ts'
            agent:
              - 'Dockerfile.agent'
              - 'apps/app/package.json'
              - 'packages/**'
              - 'proto/**'
              - 'bin/**'
              - 'package.json'
              - 'yarn.lock'
              - 'entrypoint.agent.sh'
              - 'cronjob.agent'
            ml_infer:
              - 'Dockerfile.infer'
              - 'packages/ml/python/**'
              - 'proto/**'
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          AGENT_FILTER: ${{ steps.filter.outputs.agent }}
          ML_INFER_FILTER: ${{ steps.filter.outputs.ml_infer }}
          NPM_RELEASE_FILTER: ${{ steps.filter.outputs.npm_release }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'agent_changed=true' >> "$GITHUB_OUTPUT"
            echo 'ml_infer_changed=true' >> "$GITHUB_OUTPUT"
            echo 'npm_release_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo "agent_changed=${AGENT_FILTER}" >> "$GITHUB_OUTPUT"
            echo "ml_infer_changed=${ML_INFER_FILTER}" >> "$GITHUB_OUTPUT"
            echo "npm_release_changed=${NPM_RELEASE_FILTER}" >> "$GITHUB_OUTPUT"
          fi

  beta:
    needs: changes
    if: needs.changes.outputs.npm_release_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      beta_version: ${{ steps.version.outputs.beta_version }}
      source_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            examples/sandbox/.yarn/cache
            examples/sandbox/.yarn/install-state.gz
          key: ${{ runner.os }}-beta-${{ hashFiles('yarn.lock', 'package.json', 'examples/sandbox/yarn.lock') }}
          restore-keys: ${{ runner.os }}-beta-
      - run: yarn install --immutable
      - name: Resolve beta version
        id: version
        run: |
          baseline="$(node -p "require('./packages/types/package.json').version")"
          beta_version="$(node -e 'const {resolveBetaVersion}=require("./bin/releaseChannel.cjs"); console.log(resolveBetaVersion(process.argv[1], process.argv[2]))' "$baseline" "$GITHUB_RUN_NUMBER")"
          yarn bump:packages "$beta_version"
          echo "beta_version=$beta_version" >> "$GITHUB_OUTPUT"
      - run: yarn build
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn unit
      - run: yarn npm:publish:all:dry
      - name: Publish beta candidate packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Candidate provenance is the validated workflow run + gitHead. Sigstore
          # can retain an entry after npm rejects the publish, making an exact
          # retry fail permanently with a transparency-log 409.
          YARN_NPM_PUBLISH_PROVENANCE: 'false'
        run: bash ./bin/publish-packages.sh --skip-checks --tag beta-candidate
      - name: Wait for beta registry consistency
        env:
          BETA_VERSION: ${{ steps.version.outputs.beta_version }}
        run: |
          for attempt in $(seq 1 12); do
            if [ "$(npm view "create-tradejs@${BETA_VERSION}" version 2>/dev/null)" = "$BETA_VERSION" ]; then
              exit 0
            fi
            [ "$attempt" -lt 12 ] || exit 1
            sleep 10
          done
      - run: yarn playwright install --with-deps chromium
      - name: Quickstart beta browser e2e
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          QUICKSTART_CREATE_SPEC: create-tradejs@${{ steps.version.outputs.beta_version }}
        run: yarn quickstart:e2e
      - name: Install beta sandbox dependencies
        run: yarn sandbox:install:update
      - run: cp examples/sandbox/.env.example examples/sandbox/.env
      - id: sandbox_infra
        run: yarn sandbox:infra-up
      - run: yarn sandbox:e2e
      - if: always() && steps.sandbox_infra.outcome != 'skipped'
        run: yarn sandbox:infra-down
      - name: Build and test the production-like Project image
        env:
          BETA_VERSION: ${{ steps.version.outputs.beta_version }}
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          git clone --depth 1 https://github.com/TradeJS-Dev/TradeJS-Project.git ../tradejs-project-beta
          cd ../tradejs-project-beta
          project_sha="$(git rev-parse HEAD)"
          node ./scripts/set-tradejs-version.mjs "$BETA_VERSION"
          yarn install --no-immutable
          TRADEJS_ALLOW_PRERELEASE=true yarn checks
          docker build \
            --build-arg "TRADEJS_PROJECT_SHA=$project_sha" \
            --build-arg "TRADEJS_ALLOW_PRERELEASE=true" \
            -t "tradejs-project-beta:$GITHUB_SHA" .
          bash ./scripts/beta-runtime-smoke.sh \
            "tradejs-project-beta:$GITHUB_SHA" \
            '@tradejs/app,@tradejs/cli,@tradejs/connectors,@tradejs/core,@tradejs/indicators,@tradejs/infra,@tradejs/node,@tradejs/types' \
            "$BETA_VERSION" "$project_sha"
      - name: Mark the fully verified candidate as current beta
        env:
          BETA_VERSION: ${{ steps.version.outputs.beta_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package_name in \
            @tradejs/types @tradejs/infra @tradejs/core @tradejs/node \
            @tradejs/indicators @tradejs/connectors @tradejs/cli @tradejs/app \
            create-tradejs
          do
            npm dist-tag add "${package_name}@${BETA_VERSION}" beta
          done
      - name: Verify beta dist-tags
        env:
          BETA_VERSION: ${{ steps.version.outputs.beta_version }}
        run: |
          for package_name in \
            @tradejs/types @tradejs/infra @tradejs/core @tradejs/node \
            @tradejs/indicators @tradejs/connectors @tradejs/cli @tradejs/app \
            create-tradejs
          do
            verified=false
            for attempt in $(seq 1 12); do
              if [ "$(npm view "${package_name}@beta" version 2>/dev/null || true)" = "$BETA_VERSION" ]; then
                verified=true
                break
              fi
              [ "$attempt" -lt 12 ] && sleep 10
            done
            [ "$verified" = true ] || exit 1
          done
          printf 'Validated beta %s from %s\n' "$BETA_VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish-images:
    needs: [changes, beta]
    if: >-
      ${{
        always() && needs.changes.result == 'success' &&
        (needs.beta.result == 'success' || needs.beta.result == 'skipped') &&
        (needs.changes.outputs.agent_changed == 'true' || needs.changes.outputs.ml_infer_changed == 'true')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.changes.outputs.agent_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          push: true
          tags: |
            ghcr.io/tradejs-dev/tradejs-agent:${{ github.sha }}
            ghcr.io/tradejs-dev/tradejs-agent:latest
          build-args: TRADEJS_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent,ignore-error=true
      - if: needs.changes.outputs.ml_infer_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.infer
          push: true
          tags: |
            ghcr.io/tradejs-dev/tradejs-ml-infer:${{ github.sha }}
            ghcr.io/tradejs-dev/tradejs-ml-infer:latest
          cache-from: type=gha,scope=ml-infer
          cache-to: type=gha,mode=max,scope=ml-infer,ignore-error=true
