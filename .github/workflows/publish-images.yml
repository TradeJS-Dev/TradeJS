name: Publish Release

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-release-stable
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.resolve.outputs.app_changed }}
      agent_changed: ${{ steps.resolve.outputs.agent_changed }}
      ml_infer_changed: ${{ steps.resolve.outputs.ml_infer_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed image inputs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'Dockerfile'
              - 'apps/**'
              - 'packages/**'
              - 'proto/**'
              - 'bin/**'
              - 'package.json'
              - 'yarn.lock'
              - '.yarn/**'
              - '.yarnrc.yml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - 'tsconfig.packages.json'
              - 'tradejs.config.ts'
              - 'entrypoint.sh'
              - 'cronjob'
            agent:
              - 'Dockerfile.agent'
              - 'apps/app/package.json'
              - 'packages/**'
              - 'proto/**'
              - 'bin/**'
              - 'package.json'
              - 'yarn.lock'
              - '.yarn/**'
              - '.yarnrc.yml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - 'tsconfig.packages.json'
              - 'tradejs.config.ts'
              - 'entrypoint.agent.sh'
              - 'cronjob.agent'
            ml_infer:
              - 'Dockerfile.infer'
              - 'packages/ml/python/**'
              - 'proto/**'

      - name: Resolve image changes
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          APP_FILTER: ${{ steps.filter.outputs.app }}
          AGENT_FILTER: ${{ steps.filter.outputs.agent }}
          ML_INFER_FILTER: ${{ steps.filter.outputs.ml_infer }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            echo "agent_changed=true" >> "$GITHUB_OUTPUT"
            echo "ml_infer_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "app_changed=${APP_FILTER}" >> "$GITHUB_OUTPUT"
          echo "agent_changed=${AGENT_FILTER}" >> "$GITHUB_OUTPUT"
          echo "ml_infer_changed=${ML_INFER_FILTER}" >> "$GITHUB_OUTPUT"

  release:
    needs: changes
    if: ${{ github.event.act || github.repository == 'tradejs-dev/tradejs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_sha: ${{ steps.release_commit.outputs.sha }}

    steps:
      - name: Checkout stable with tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.sha || 'stable' }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            examples/sandbox/.yarn/cache
            examples/sandbox/.yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', 'examples/sandbox/yarn.lock', 'examples/sandbox/package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn4-

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-stable-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Resolve synchronized release version
        id: release
        run: |
          yarn bump:packages auto
          version="$(node -p "require('./packages/types/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved npm release v$version"

      - name: Verify root lockfile after version update
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn unit

      - name: Preflight package archives
        run: yarn npm:publish:all:dry

      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn npm whoami

      - name: Persist synchronized package versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/package.json packages/*/package.json examples/sandbox/package.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
          fi

          git push origin HEAD:stable

      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_PROVENANCE: 'true'
        run: yarn npm:publish:all

      - name: Wait for create-tradejs on npm
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            if [ "$(npm view "create-tradejs@${RELEASE_VERSION}" version 2>/dev/null)" = "$RELEASE_VERSION" ]; then
              exit 0
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "create-tradejs@${RELEASE_VERSION} is not available after ${attempt} attempts" >&2
              exit 1
            fi

            echo "create-tradejs@${RELEASE_VERSION} is not available yet; retrying in 10 seconds"
            sleep 10
          done

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Quickstart browser e2e
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          QUICKSTART_CREATE_SPEC: create-tradejs@${{ steps.release.outputs.version }}
        run: yarn quickstart:e2e

      - name: Install freshly published sandbox dependencies
        run: |
          for attempt in $(seq 1 12); do
            if yarn sandbox:install:update; then
              exit 0
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "Fresh npm packages were not available after ${attempt} attempts" >&2
              exit 1
            fi

            echo "Fresh npm packages are not available yet; retrying in 10 seconds"
            sleep 10
          done

      - name: Prepare sandbox env
        run: cp examples/sandbox/.env.example examples/sandbox/.env

      - name: Sandbox infra up
        id: sandbox_infra_up
        run: yarn sandbox:infra-up

      - name: Sandbox deterministic e2e
        run: yarn sandbox:e2e

      - name: Sandbox infra down
        if: ${{ always() && steps.sandbox_infra_up.outcome != 'skipped' }}
        run: yarn sandbox:infra-down

      - name: Persist sandbox lockfile and resolve release commit
        id: release_commit
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git add examples/sandbox/yarn.lock

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): refresh sandbox lockfile for v${RELEASE_VERSION} [skip ci]"
            git push origin HEAD:stable
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag successful release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"

          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag ${tag} already points to another commit" >&2
              exit 1
            fi
          else
            git tag -a "$tag" -m "TradeJS ${tag}"
            git push origin "refs/tags/${tag}"
          fi

  publish-images:
    needs:
      - changes
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP_CHANGED: ${{ needs.changes.outputs.app_changed }}
      AGENT_CHANGED: ${{ needs.changes.outputs.agent_changed }}
      ML_INFER_CHANGED: ${{ needs.changes.outputs.ml_infer_changed }}
      IMAGE_TAG: ${{ needs.release.outputs.release_sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        if: env.APP_CHANGED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tradejs-dev/tradejs-app:${{ env.IMAGE_TAG }}
            ghcr.io/tradejs-dev/tradejs-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app,ignore-error=true

      - name: Build and push agent image
        if: env.AGENT_CHANGED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          push: true
          tags: |
            ghcr.io/tradejs-dev/tradejs-agent:${{ env.IMAGE_TAG }}
            ghcr.io/tradejs-dev/tradejs-agent:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent,ignore-error=true

      - name: Build and push ml-infer image
        if: env.ML_INFER_CHANGED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.infer
          push: true
          tags: |
            ghcr.io/tradejs-dev/tradejs-ml-infer:${{ env.IMAGE_TAG }}
            ghcr.io/tradejs-dev/tradejs-ml-infer:latest
          cache-from: type=gha,scope=ml-infer
          cache-to: type=gha,mode=max,scope=ml-infer,ignore-error=true
