# .github/workflows/deploy.yml

name: Deploy
on:
  push:
    branches:
      - stable
    tags:
      - v**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Env file
        run: |
          echo "
          PORT=3000
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_ENDPOINT=${{ secrets.OPENAI_API_ENDPOINT }}
          APP_URL=https://aleksnick01inv.fvds.ru
          TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID=207660648
          PUPPETEER_SKIP_DOWNLOAD=true
          PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
          REDIS_HOST=redis
          REDIS_PORT=6379
          PG_HOST=timescale
          PG_PORT=5432
          PG_USER=app
          PG_PASSWORD=app
          PG_DATABASE=app
          " > .env

      - name: Test env
        run: |
          cat .env
  
      - name: Docker login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build Docker images
        run: docker-compose build
  
      - name: Push Docker images
        run: docker-compose push

      - name: Copy compose and configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ".env,docker-compose.yml,nginx,sql,certbot,init-cert.sh"
          target: ~/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/
            docker image prune -a -f
            docker compose pull
            systemctl stop nginx
            systemctl disable nginx
            docker compose up -d --remove-orphans
            docker restart nginx
            chmod 777 ./data
