name: Deploy
on:
  push:
    branches:
      - stable
    tags:
      - v**
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ml_infer: ${{ steps.filter.outputs.ml_infer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed deploy targets
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ml_infer:
              - 'packages/ml/python/**'
              - 'proto/**'
              - 'Dockerfile.infer'

  repo-checks:
    needs: changes
    if: ${{ github.event.act || github.repository == 'tradejs-dev/tradejs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-stable-
            ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit Tests
        run: yarn unit

  sandbox-e2e:
    needs: repo-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-stable-
            ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Prepare Sandbox Env
        run: cp examples/sandbox/.env.example examples/sandbox/.env

      - name: Install Sandbox Dependencies
        run: yarn sandbox:install

      - name: Sandbox Infra Up
        run: cd examples/sandbox && yarn infra-up

      - name: Sandbox Deterministic E2E
        run: cd examples/sandbox && yarn e2e

      - name: Sandbox Infra Down
        if: always()
        run: cd examples/sandbox && yarn infra-down

  deploy:
    needs:
      - changes
      - sandbox-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ML_INFER_CHANGED: ${{ needs.changes.outputs.ml_infer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Env file
        run: |
          echo "
          PORT=3000
          NODE_ENV=production
          APP_URL=https://app.tradejs.dev
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL=https://app.tradejs.dev
          PUPPETEER_SKIP_DOWNLOAD=true
          PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
          REDIS_HOST=redis
          REDIS_PORT=6379
          ML_GRPC_ADDRESS=ml-infer:50051
          PG_HOST=timescale
          PG_PORT=5432
          PG_USER=app
          PG_PASSWORD=app
          PG_DATABASE=app
          AGENT_GITHUB_REPOSITORY=TradeJS-Dev/TradeJS
          AGENT_GITHUB_BASE_BRANCH=stable
          AGENT_GITHUB_TOKEN=${{ secrets.AGENT_GITHUB_TOKEN }}
          DERIVATIVES_CONTEXT_ENABLED=true
          DERIVATIVES_CONTEXT_INTERVALS=15m,1h
          DERIVATIVES_CONTEXT_LOOKBACK_HOURS=48
          " > .env

      - name: Docker login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Build Docker images
        run: |
          docker-compose -f docker-compose.prod.yml build --pull app
          docker-compose -f docker-compose.prod.yml build --pull agent
          if [ "${ML_INFER_CHANGED}" = "true" ]; then
            docker-compose -f docker-compose.prod.yml build --pull ml-infer
          else
            echo "Skipping ml-infer build; no matching changes detected."
          fi

      - name: Push Docker images
        run: |
          docker-compose -f docker-compose.prod.yml push app agent
          if [ "${ML_INFER_CHANGED}" = "true" ]; then
            docker-compose -f docker-compose.prod.yml push ml-infer
          else
            echo "Skipping ml-infer push; no matching changes detected."
          fi

      - name: Copy compose and configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ".env,docker-compose.prod.yml,nginx,sql,certbot,init-cert.sh"
          target: ~/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ML_INFER_CHANGED: ${{ env.ML_INFER_CHANGED }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ML_INFER_CHANGED
          script: |
            cd ~/
            mkdir -p agent-ssh
            cat > agent-ssh/id_ed25519 <<'EOF'
            ${{ secrets.AGENT_GIT_SSH_KEY }}
            EOF
            chmod 700 agent-ssh
            chmod 600 agent-ssh/id_ed25519
            ssh-keyscan github.com > agent-ssh/known_hosts
            chmod 644 agent-ssh/known_hosts
            if [ ! -d tradejs-agent-repo/.git ]; then
              GIT_SSH_COMMAND="ssh -i ~/agent-ssh/id_ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/agent-ssh/known_hosts" \
                git clone git@github.com:TradeJS-Dev/TradeJS.git ~/tradejs-agent-repo
            else
              GIT_SSH_COMMAND="ssh -i ~/agent-ssh/id_ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/agent-ssh/known_hosts" \
                git -C ~/tradejs-agent-repo fetch origin stable
              git -C ~/tradejs-agent-repo checkout stable
              git -C ~/tradejs-agent-repo reset --hard origin/stable
            fi
            docker compose -f docker-compose.prod.yml pull
            systemctl stop nginx
            systemctl disable nginx
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            if [ "${ML_INFER_CHANGED}" = "true" ]; then
              docker compose -f docker-compose.prod.yml up -d --force-recreate ml-infer
            fi
            docker restart nginx
            chmod 777 ./data
