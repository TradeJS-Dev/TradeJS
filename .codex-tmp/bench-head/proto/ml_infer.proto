syntax = "proto3";

package ml_infer;

service MlInfer {
  rpc Predict (PredictRequest) returns (PredictResponse) {}
}

message PredictRequest {
  string strategy = 1;
  map<string, double> features = 2;
  double threshold = 3;
}

message PredictResponse {
  double probability = 1;
  double threshold = 2;
  bool passed = 3;
}
