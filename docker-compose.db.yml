# docker-compose.db.yml

services:
  timescale:
    container_name: inv-timescale
    image: timescale/timescaledb:latest-pg16
    platform: linux/amd64   # на Mac M1/M2/M3/M4
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [web]

networks:
  web:
    driver: bridge

volumes:
  pgdata:
